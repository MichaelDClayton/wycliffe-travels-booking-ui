<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Failed — Wycliffe Travels</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #0d0d0d;
    border: 1px solid #1f1f1f;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .logo { width: 180px; height: auto; margin: 0 auto 24px; display: block; }
  .cross {
    width: 72px; height: 72px; border-radius: 50%;
    background: #dc2626;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    animation: pop 0.4s ease-out;
  }
  .cross svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  h1 {
    font-size: 28px;
    color: #f5c518;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  p { color: #b8b8b8; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
  .notice {
    margin: 28px 0;
    padding: 16px;
    background: #1a0f0f;
    border: 1px solid #3a1a1a;
    border-radius: 10px;
    font-size: 14px;
    color: #f0c8c8;
    line-height: 1.6;
  }
  .order {
    margin: 20px 0 8px;
    padding: 16px;
    background: #161616;
    border-radius: 10px;
    font-size: 13px;
    color: #888;
  }
  .order strong { color: #fff; display: block; margin-top: 4px; font-size: 15px; letter-spacing: 1px; }
  .footer { margin-top: 24px; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <main class="card">
    <img src="https://clay-tech-public-assets.s3.us-east-1.amazonaws.com/Wycliffe+Travels+Logo.png" alt="Wycliffe Travels — Safari & Tour" class="logo" />
    <div class="cross">
      <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </div>
    <h1>Payment Failed</h1>
    <p>Unfortunately, your payment could not be processed.</p>

    <div class="notice">
      Please revisit the URL/Link in your original booking email to try again.
    </div>

    <div class="order">
      Reference
      <strong id="ref">—</strong>
    </div>

    <p class="footer">Need help? Reply to your booking email and we'll assist you.</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session_id');
    document.getElementById('ref').textContent = sid ? sid.slice(-12).toUpperCase() : 'NOT COMPLETED';
  </script>
</body>
</html>
