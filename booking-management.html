<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Your Booking | Wycliffe Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .details-card { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .btn-cancel { background-color: #e74c3c; }
        .btn-reschedule { background-color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://clay-tech-public-assets.s3.us-east-1.amazonaws.com/Wycliffe+Travels+Logo.png" alt="Logo" style="width: 150px; margin-bottom: 20px;">
    <h2>Manage Your Booking</h2>

    <div id="authSection">
        <input type="text" id="id" placeholder="Booking Reference">
        <input type="email" id="email" placeholder="Email Address">
        <button onclick="fetchBooking()">View Booking</button>
    </div>

    <div id="bookingDetails" class="details-card" style="display:none;">
        <p><strong>Date:</strong> <span id="displayDate"></span></p>
        <p><strong>Status:</strong> <span id="displayStatus"></span></p>

        <button class="btn-cancel" onclick="performAction('cancel')">Cancel Booking</button>
        <button class="btn-reschedule" onclick="toggleReschedule()">Reschedule Booking</button>

        <div id="rescheduleUI" style="display:none; margin-top: 15px;">
            <label>New Date/Time:</label>
            <input type="datetime-local" id="newDateInput">
            <button onclick="performAction('reschedule')">Confirm Change</button>
        </div>
    </div>
</div>

<script>
    async function fetchBooking() {
        const id = document.getElementById('id').value;
        const email = document.getElementById('email').value;

        const response = await fetch(`/prod/booking?id=${id}&email=${email}`);
        if (response.ok) {
            const data = await response.json();
            document.getElementById('displayDate').innerText = data.startTime;
            document.getElementById('displayStatus').innerText = data.status;
            document.getElementById('bookingDetails').style.display = 'block';
        } else {
            alert("Booking not found or access denied.");
        }
    }

    function toggleReschedule() {
        const ui = document.getElementById('rescheduleUI');
        ui.style.display = (ui.style.display === 'none') ? 'block' : 'none';
    }

    async function performAction(action) {
        const payload = {
            bookingId: document.getElementById('id').value,
            email: document.getElementById('email').value,
            newStartTime: document.getElementById('newDateInput').value
        };

        const response = await fetch(`/prod/booking/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert("Action successful: " + action);
            location.reload(); // Refreshes page to show updated status
        } else {
            alert("Action failed. Please try again.");
        }
    }
</script>

</body>
</html>
